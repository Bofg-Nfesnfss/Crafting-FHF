<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合成大昊翬</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 防止手機瀏覽器預設拉動行為 */
        }

        body {
            background-color: #f7f1e3;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #score-board {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 540px;
            background-color: #ffeaa7;
            border: 4px solid #d63031;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        #danger-line {
            position: absolute;
            top: 100px;
            left: 0;
            width: 100%;
            height: 2px;
            border-top: 2px dashed #ff7675;
            z-index: 10;
        }

        canvas {
            display: block;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #game-over h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ff7675;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        #restart-btn:hover {
            background-color: #55efc4;
            color: #2d3436;
        }
        #game-title {
            font-size: 28px;
            font-weight: bold;
            color: #d63031;
            margin-bottom: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1 id="game-title">合成大昊翬</h1>
    <div id="score-board">得分：<span id="score">0</span></div>

    <div id="game-container">
        <div id="danger-line"></div>
        <div id="game-over">
            <h1 id="game-over-title">遊戲結束</h1>
            <button id="restart-btn" onclick="restartGame()">再試一次</button>
        </div>
    </div>

    <script>
        const FRUITS = [
            { name: 'FHF1', src: './images/fhf1.png', width: 296, height: 294, radius: 16, score: 4 },
            { name: 'FHF2', src: './images/fhf2.png', width: 695, height: 746, radius: 24, score: 8 },
            { name: 'FHF3', src: './images/fhf3.png', width: 1484, height: 1846, radius: 32, score: 16, imageScale: 1.25 },
            { name: 'FHF4', src: './images/fhf4.png', width: 1187, height: 1062, radius: 48, score: 32, imageScale: 1.25 },
            { name: 'FHF5', src: './images/fhf5.png', width: 1204, height: 1681, radius: 60, score: 64 },
            { name: 'FHF6', src: './images/fhf6.png', width: 186, height: 209, radius: 72, score: 128 },
            { name: 'FHF7', src: './images/fhf7.png', width: 236, height: 262, radius: 96, score: 256 },
            { name: 'FHF8', src: './images/fhf8.png', width: 986, height: 986, radius: 128, score: 512 },
            { name: 'FHF9', src: './images/fhf9.png', width: 601, height: 672, radius: 160, score: 1024 },
            { name: 'FHF10', src: './images/fhf10.png', width: 601, height: 672, radius: 192, score: 2048 },
            { name: 'FHF11', src: './images/fhf11.png', width: 601, height: 672, radius: 256, score: 4096 }
        ];

        // 計算圖片對應物理半徑的縮放比
        FRUITS.forEach(fruit => {
            const shortestSide = Math.min(fruit.width, fruit.height || fruit.width);
            fruit.scale = ((fruit.radius * 2) / shortestSide) * (fruit.imageScale || 1);
        });

        const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;

        let engine, render, runner;
        let currentFruit = null;
        let canDrop = true;
        let score = 0;
        let isGameOver = false;
        let gameOverTimer = null;
        let isTouching = false; // 紀錄觸控狀態

        const container = document.getElementById('game-container');
        const width = 360;
        const height = 540;
        const bgm = new Audio('./audio/chunfungpakyue.mp3');
        bgm.loop = true;
        bgm.volume = 0.5;
        bgm.muted = true;

        function startBgm() {
            if (!bgm.paused) return;
            bgm.play().catch(() => {});
        }

        function unlockBgm() {
            bgm.muted = false;
            startBgm();
        }

        bgm.play().catch(() => {});

        function init() {
            score = 0;
            isGameOver = false;
            canDrop = true;
            isTouching = false;
            if (gameOverTimer) clearTimeout(gameOverTimer);
            gameOverTimer = null;

            document.getElementById('score').innerText = score;
            document.getElementById('game-over').style.display = 'none';

            container.querySelectorAll('canvas').forEach(c => c.remove());

            engine = Engine.create({ constraintIterations: 3 });

            render = Render.create({
                element: container,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: '#ffeaa7'
                }
            });

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            const wallOptions = { isStatic: true, render: { fillStyle: '#d63031' } };
            const ground = Bodies.rectangle(width / 2, height + 20, width, 50, wallOptions);
            const leftWall = Bodies.rectangle(-20, height / 2, 50, height * 2, wallOptions);
            const rightWall = Bodies.rectangle(width + 20, height / 2, 50, height * 2, wallOptions);

            Composite.add(engine.world, [ground, leftWall, rightWall]);

            spawnFruit();

            Events.on(engine, 'collisionStart', handleCollision);
            Events.on(engine, 'afterUpdate', checkGameOver);
        }

        function spawnFruit() {
            if (isGameOver) return;

            const randomIndex = Math.floor(Math.random() * 3);
            currentFruit = createFruitBody(width / 2, 50, randomIndex, {
                isStatic: true,
                isSensor: true
            });

            Composite.add(engine.world, currentFruit);
            canDrop = true;
        }

        function createFruitBody(x, y, level, options = {}) {
            const fruitData = FRUITS[level];
            const hitboxRadius = fruitData.radius * (fruitData.imageScale || 1);

            return Bodies.circle(x, y, hitboxRadius, {
                ...options,
                render: {
                    sprite: {
                        texture: fruitData.src,
                        xScale: fruitData.scale,
                        yScale: fruitData.scale
                    }
                },
                plugin: { level }
            });
        }

        // --- 手機按住拖動、鬆開下落邏輯 ---

        function moveFruit(e) {
            if (!currentFruit) return;
            const rect = container.getBoundingClientRect();
            let x = e.clientX - rect.left;

            const fruitData = FRUITS[currentFruit.plugin.level];
            const radius = fruitData.radius * (fruitData.imageScale || 1);
            x = Math.max(radius, Math.min(width - radius, x));

            Body.setPosition(currentFruit, { x: x, y: 50 });
        }

        // 按下時：按住並跟隨位置
        container.addEventListener('pointerdown', (e) => {
            unlockBgm();
            if (!canDrop || !currentFruit || isGameOver) return;
            isTouching = true;
            moveFruit(e);
        });

        // 移動時：若處於按住狀態則持續跟隨
        container.addEventListener('pointermove', (e) => {
            if (!isTouching || !canDrop || !currentFruit || isGameOver) return;
            moveFruit(e);
        });

        // 鬆開時：水果發射下落
        container.addEventListener('pointerup', (e) => {
            if (!isTouching || !canDrop || !currentFruit || isGameOver) return;
            isTouching = false;
            canDrop = false;

            currentFruit.isSensor = false;
            Body.setStatic(currentFruit, false);
            currentFruit = null;

            setTimeout(() => {
                spawnFruit();
            }, 800);
        });

        // 碰撞與合成
        function handleCollision(event) {
            const pairs = event.pairs;

            pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;

                if (
                    bodyA.plugin && bodyB.plugin &&
                    bodyA.plugin.level !== undefined &&
                    bodyA.plugin.level === bodyB.plugin.level
                ) {
                    const currentLevel = bodyA.plugin.level;

                    if (currentLevel >= FRUITS.length - 1) return;

                    Composite.remove(engine.world, [bodyA, bodyB]);

                    const newX = (bodyA.position.x + bodyB.position.x) / 2;
                    const newY = (bodyA.position.y + bodyB.position.y) / 2;
                    const nextLevel = currentLevel + 1;
                    const nextFruitData = FRUITS[nextLevel];

                    score += nextFruitData.score;
                    document.getElementById('score').innerText = score;

                    const newFruit = createFruitBody(newX, newY, nextLevel, {
                        restitution: 0.2
                    });

                    Composite.add(engine.world, newFruit);

                    if (nextLevel === FRUITS.length - 1) {
                        triggerGameOver('成功合成馮昊翬');
                    }
                }
            });
        }

        // 帶 3 秒緩衝的結束判定
        function checkGameOver() {
            if (isGameOver) return;

            const bodies = Composite.allBodies(engine.world);
            let isOverLine = false;

            for (let body of bodies) {
                if (!body.isStatic && !body.isSensor && body.position.y < 100) {
                    if (Math.abs(body.velocity.y) < 0.2) {
                        isOverLine = true;
                        break;
                    }
                }
            }

            if (isOverLine) {
                if (!gameOverTimer) {
                    gameOverTimer = setTimeout(() => {
                        triggerGameOver('昊翬合成失敗');
                    }, 3000);
                }
            } else {
                if (gameOverTimer) {
                    clearTimeout(gameOverTimer);
                    gameOverTimer = null;
                }
            }
        }

        function triggerGameOver(title) {
            isGameOver = true;
            document.getElementById('game-over-title').innerText = title;
            document.getElementById('game-over').style.display = 'flex';
        }

        function restartGame() {
            Engine.clear(engine);
            init();
        }

        // 啟動遊戲
        init();
    </script>
</body>
</html>
